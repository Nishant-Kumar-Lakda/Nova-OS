name: NOVA Android Native

on:
  workflow_dispatch:
  push:
    paths:
      - "android-bridge/**"
      - "android/**"
      - "nexus/**"
      - "air/**"
      - "core/**"
      - "models/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch pinned llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git android/app/src/main/cpp/llama.cpp
          cd android/app/src/main/cpp/llama.cpp
          git checkout 9a286ac98d2cab74231bd3f1fc3f2b8bdf05422e

      - name: Fetch SmolLM2 135M Q2_K model
        run: |
          mkdir -p android/app/src/main/assets/models
          curl -L --fail --retry 3 \
            "https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q2_K.gguf?download=true" \
            -o android/app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf
          test -s android/app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf
          sha256sum android/app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf | tee android/app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf.sha256

      - name: Build Rust Android bridge
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 build --release -p nova-android-bridge

      - name: Package Rust bridge libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
          cp target/aarch64-linux-android/release/libnova_android_bridge.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libnova_android_bridge.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libnova_android_bridge.so android/app/src/main/jniLibs/x86_64/
          cp target/i686-linux-android/release/libnova_android_bridge.so android/app/src/main/jniLibs/x86/

      - name: Verify native bridge presence
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libnova_android_bridge.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libnova_android_bridge.so
          test -f android/app/src/main/jniLibs/x86_64/libnova_android_bridge.so
          test -f android/app/src/main/jniLibs/x86/libnova_android_bridge.so

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK with local AI model
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK has model asset
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'SmolLM2-135M-Instruct-Q2_K.gguf'

      - name: Verify APK does not request cloud or privileged permissions
        run: |
          ! unzip -p android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -a -E 'INTERNET|BIND_ACCESSIBILITY_SERVICE|DEVICE_ADMIN|READ_CONTACTS|READ_SMS|RECORD_AUDIO|BLUETOOTH_CONNECT|CHANGE_WIFI_STATE'

      - name: Generate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee nova-android-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-native-ai-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            nova-android-debug.apk.sha256

      - name: Upload model checksum
        uses: actions/upload-artifact@v4
        with:
          name: nova-smollm2-model-checksum
          path: android/app/src/main/assets/models/SmolLM2-135M-Instruct-Q2_K.gguf.sha256
