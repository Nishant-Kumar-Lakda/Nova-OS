name: NOVA CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  android-safe-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify prototype permissions are safe
        run: |
          ! grep -R -E 'android\.permission\.(INTERNET|ACCESSIBILITY_SERVICE|BIND_ACCESSIBILITY_SERVICE|WRITE_SETTINGS|MODIFY_AUDIO_SETTINGS|BLUETOOTH_CONNECT|BLUETOOTH_SCAN|BLUETOOTH_ADMIN|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|READ_CONTACTS|READ_SMS|RECEIVE_SMS|RECORD_AUDIO)' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK and unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
